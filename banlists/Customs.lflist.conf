#[Customs Format]
!Customs

# -------------------------------------------------
# CUSTOMS FORMAT
# TCG + OCG + Custom Cards
# -------------------------------------------------
# 0 = Forbidden
# 1 = Limited
# 2 = Semi-Limited
#
# Cards not listed here are Unlimited at 3 copies.
# Format:
# CARD_ID LIMIT --Card Name
# -------------------------------------------------

# =========================
# FORBIDDEN
# =========================

# Example:
# 12345678 0 --Example Forbidden Card


# =========================
# LIMITED
# =========================

# Example:
# 23456789 1 --Example Limited Card


# =========================
# SEMI-LIMITED
# =========================

# Example:
# 34567890 2 --Example Semi-Limited Card